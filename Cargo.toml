[package]
name = "x-usb-bridge"
version = "0.0.1"
edition = "2024"
publish = false
license = "MIT"
description = "Up to 32-channel audio capture, routing, and remote monitoring utility for the Behringer X32 X-USB expansion card"
repository = "https://github.com/chfuchte/x-usb-bridge"

[[bin]]
name = "x-usb-bridge"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.12"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["cargo"] }
tracing = "0.1"
hound = "3.5"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rust-embed = "8.12"
mime_guess = "2.0"
axum = "0.8"
tower = "0.5"
tokio = { version = "1.53", features = ["full"] }
rosc = "0.11"
